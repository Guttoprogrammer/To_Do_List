<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grechen+Fuemen&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <header>
            <h1>To do List!</h1>
            <h3>Seja bem vindo a sua lista de tarefas!</h3>
            
        </header>
        <form id="form">
            <h2>Digite abaixo suas tarefas!</h2>
            <input id="formInput" type="text" placeholder="Ex: Estudar JS">
            <p id="erro"></p>
            <button id="btnclick" type="submit">+Adicionar</button>
        </form>
        <ul id="lista-tarefa">
            <h3>Tarefas</h3>
        </ul>
    </main>
    <script src="./main.js"></script>
</body>
</html>
